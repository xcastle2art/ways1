<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>나라장터 입찰 모니터링 · 전국</title>
<meta name="description" content="나라장터 입찰공고·사전규격·개찰결과를 전국 기준 최근 30일로 모아 보는 대시보드" />
<link rel="stylesheet" href="style.css" />
<style>.drawer-wrap[hidden]{display:none !important}</style>
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark">G2B</span>
      <span class="brand__text">
        <strong>나라장터 입찰 모니터링</strong>
        <small>전국 지자체·기관 · 최근 30일 · 14개 키워드</small>
      </span>
    </div>
    <div class="topbar__right">
      <span class="stamp" id="updatedStamp">기준 불러오는 중…</span>
      <button class="btn btn--ghost" id="reloadBtn" type="button" title="캐시를 무시하고 새로 받기">새로고침</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="화면 전환">
    <button class="tab is-active" data-tab="all" type="button">전체 <span class="tab__count" data-count="all"></span></button>
    <button class="tab" data-tab="bid" type="button">입찰공고 <span class="tab__count" data-count="bid"></span></button>
    <button class="tab" data-tab="prespec" type="button">사전규격 <span class="tab__count" data-count="prespec"></span></button>
    <button class="tab" data-tab="result" type="button">개찰결과 <span class="tab__count" data-count="result"></span></button>
    <button class="tab" data-tab="managers" type="button">담당권역</button>
  </nav>
</header>

<main class="wrap">
  <div id="loadError" class="alert" hidden></div>

  <!-- 요약 -->
  <section class="kpis" id="kpis" aria-label="요약 지표"></section>

  <!-- 추적 건 -->
  <section class="watch" id="watch" aria-label="추적 건"></section>

  <!-- 담당권역 -->
  <section id="managerView" class="manager-view" hidden>
    <div class="section-head">
      <h2>담당권역 현황</h2>
      <p>4명 담당자별 권역 요약입니다. 카드를 누르면 해당 권역 공고만 걸러서 봅니다. <b>경기도는 오창민·김충열 두 사람 모두</b>에게 잡힙니다.</p>
    </div>
    <div class="manager-grid" id="managerGrid"></div>
    <div class="region-strip" id="regionStrip"></div>
  </section>

  <!-- 목록 -->
  <section id="listView">
    <div class="filters" id="filters">
      <div class="filters__row">
        <label class="search">
          <span class="sr">검색</span>
          <input type="search" id="q" placeholder="사업명 · 발주기관 · 공고번호 검색" autocomplete="off" />
        </label>
        <select id="regionSel" aria-label="지역"></select>
        <select id="sortSel" aria-label="정렬">
          <option value="deadline">마감 임박순</option>
          <option value="posted">공고 최신순</option>
          <option value="budget">금액 큰 순</option>
        </select>
      </div>
      <div class="chips" id="managerChips" aria-label="담당자 필터"></div>
      <div class="chips chips--scroll" id="keywordChips" aria-label="키워드 필터"></div>
    </div>

    <div class="list-head">
      <h2 id="listTitle">전체</h2>
      <span class="list-head__meta" id="listMeta"></span>
    </div>
    <div id="list" class="list"></div>
    <div class="empty" id="emptyState" hidden></div>
  </section>

  <footer class="foot" id="foot"></footer>
</main>

<!-- 상세 드로어 -->
<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-veil" data-close="1"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="공고 상세"></aside>
</div>

<script src="app.js"></script>
</body>
</html>
