<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>나라장터 입찰 모니터링 · 시·도별</title>
<meta name="description" content="나라장터 입찰공고·사전규격·개찰결과를 시·도별로 한눈에 보는 대시보드 (최근 30일)" />
<link rel="stylesheet" href="style.css?v=20261122f" />
<style>.drawer-wrap[hidden]{display:none !important}</style>
</head>
<body>

<header class="bar">
  <div class="bar__in">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">G2B</span>
      <span class="brand__text">
        <strong>나라장터 입찰 모니터링</strong>
        <small id="brandSub">전국 · 최근 30일</small>
      </span>
    </div>
    <div class="bar__right">
      <span class="stamp" id="updatedStamp">불러오는 중…</span>
      <button class="iconbtn" id="reloadBtn" type="button" title="새로고침" aria-label="새로고침">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3a7 7 0 1 0 6.32 4H14.2A5 5 0 1 1 10 5v2.5L14.5 4 10 0.5V3Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
  <nav class="sido" id="sidoNav" aria-label="시·도 선택"></nav>
</header>

<main class="wrap">
  <div id="loadError" class="alert" hidden></div>

  <!-- 메뉴 바로 아래: 지금 당장 챙길 것만 -->
  <section class="urgent" id="urgent" aria-label="지금 챙길 것" hidden></section>

  <!-- 종류 · 검색 · 정렬 -->
  <section class="toolbar" aria-label="필터">
    <div class="seg" id="kindSeg" role="tablist" aria-label="공고 종류"></div>
    <div class="toolbar__row">
      <label class="search">
        <span class="sr">검색</span>
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.4 9.8l3.65 3.65 1.4-1.4-3.64-3.65A5.5 5.5 0 0 0 8.5 3Zm0 2a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z" fill="currentColor"/></svg>
        <input type="search" id="q" placeholder="사업명 · 발주기관 · 공고번호" autocomplete="off" />
      </label>
      <select id="sortSel" aria-label="정렬">
        <option value="deadline">마감 임박순</option>
        <option value="posted">공고 최신순</option>
        <option value="budget">금액 큰 순</option>
      </select>
    </div>
    <div class="kwrow" id="kwRow" aria-label="키워드 필터"></div>
  </section>

  <div class="listhead">
    <h2 id="listTitle">전체</h2>
    <span class="listhead__meta" id="listMeta"></span>
    <button class="linkbtn" id="pastBtn" type="button" hidden></button>
    <button class="linkbtn" id="resetBtn" type="button" hidden>필터 초기화</button>
  </div>

  <div id="list" class="list"></div>
  <div class="empty" id="emptyState" hidden></div>

  <details class="watch" id="watch" hidden>
    <summary><span>계속 지켜보는 건</span><span class="watch__n" id="watchN"></span></summary>
    <div class="watch__body" id="watchBody"></div>
  </details>

  <footer class="foot" id="foot"></footer>
</main>

<!-- 상세 드로어 -->
<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-veil" data-close="1"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="공고 상세"></aside>
</div>

<script src="app.js?v=20261122f"></script>
</body>
</html>
